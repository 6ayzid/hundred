<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-back" x1="6" y1="6" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c66be" />
      <stop offset="100%" stop-color="#4e3a88" />
    </linearGradient>
    <linearGradient id="fav-card" x1="8" y1="6" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff93b2" />
      <stop offset="50%" stop-color="#ee4d7c" />
      <stop offset="100%" stop-color="#d42f5e" />
    </linearGradient>
    <linearGradient id="fav-star" x1="46" y1="3" x2="61" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff099" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
  </defs>

  <!-- Tilted purple card back peek -->
  <g transform="rotate(-11 26 32)">
    <rect x="4" y="7" width="40" height="49" rx="11" fill="url(#fav-back)" stroke="#382864" stroke-width="2" />
  </g>

  <!-- Tactile lower card depth edge so white/light browser tabs still frame cleanly -->
  <rect x="8" y="11.5" width="51" height="50" rx="14.5" fill="#b3244f" fill-opacity="0.38" />

  <!-- Primary 100 card badge sized generously for 16px/32px browser tab clarity -->
  <rect x="8" y="8.5" width="51" height="50" rx="14.5" fill="url(#fav-card)" stroke="#fffaf5" stroke-width="2.4" />
  <path
    d="M11 21 C11 13.5 15 11 22 11 H45 C52 11 56 13.5 56 21 C43 24.5 24 24.5 11 21 Z"
    fill="#ffffff"
    fill-opacity="0.16"
  />
  <rect x="12.2" y="12.7" width="42.6" height="41.6" rx="10.5" stroke="#fff0b5" stroke-opacity="0.62" stroke-width="1.5" stroke-dasharray="3.5 2.5" />

  <!-- Subtle shadow under centered 100 -->
  <g transform="translate(0, 1.8)" opacity="0.34">
    <path d="M16.2 28.4 L18.8 25 V42 M16.4 42 H21.2" stroke="#68102b" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="25.8" y="25" width="9.8" height="17" rx="4.9" stroke="#68102b" stroke-width="4.7" />
    <rect x="40.4" y="25" width="9.8" height="17" rx="4.9" stroke="#68102b" stroke-width="4.7" />
  </g>

  <!-- Bold white rounded centered 100 numerals -->
  <path d="M16.2 28.4 L18.8 25 V42 M16.4 42 H21.2" stroke="#fffef9" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="25.8" y="25" width="9.8" height="17" rx="4.9" stroke="#fffef9" stroke-width="4.7" />
  <rect x="40.4" y="25" width="9.8" height="17" rx="4.9" stroke="#fffef9" stroke-width="4.7" />

  <!-- Top-right gold star charm -->
  <path
    d="M53.5 4.2 L55.8 9.2 L61.2 9.9 L57.2 13.7 L58.2 19 L53.5 16.4 L48.8 19 L49.8 13.7 L45.8 9.9 L51.2 9.2 Z"
    fill="url(#fav-star)"
    stroke="#bf6506"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
